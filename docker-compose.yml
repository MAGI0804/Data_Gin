services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gin-biz-web-api
    env_file:
      - .env
    expose:
      - "8501"
    volumes:
      - ./storage:/app/storage
      - ${EXCEL_TEMP_HOST_DIR:-./storage/tmp/data-warehouse-excel}:${DATA_WAREHOUSE_EXCEL_TEMP_DIR:-/data/data-warehouse-excel}
      - ./app.log:/app/app.log
      - ./etc/config.yaml:/app/etc/config.yaml:ro
    environment:
      - TZ=Asia/Shanghai
      - ENV=${ENV:-docker}
      - DEBUG=${DEBUG:-false}
      - APP_URL=${APP_URL:-http://localhost}
      - APP_PORT=${APP_PORT:-8501}
      - GIN_MODE=${GIN_MODE:-release}
      - SSL_ENABLED=${SSL_ENABLED:-false}
      - DB_HOST=${DB_HOST:?set DB_HOST}
      - DB_PORT=${DB_PORT:-3306}
      - DB_DATABASE=${DB_DATABASE:?set DB_DATABASE}
      - DB_USERNAME=${DB_USERNAME:?set DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD:?set DB_PASSWORD}
      - REDIS_HOST=${REDIS_HOST:-host.docker.internal}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_USERNAME=${REDIS_USERNAME:-}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - DATA_WAREHOUSE_EXCEL_TEMP_DIR=${DATA_WAREHOUSE_EXCEL_TEMP_DIR:-/data/data-warehouse-excel}
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - gin-network

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: gin-biz-web
    depends_on:
      - app
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./ssl:/etc/nginx/ssl:ro
    restart: unless-stopped
    networks:
      - gin-network

networks:
  gin-network:
    driver: bridge
